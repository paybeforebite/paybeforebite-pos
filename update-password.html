<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Restaurant POS | Update Password</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand">
        <div class="login-logo">🔑</div>
        <div>
          <p class="eyebrow">ACCOUNT SECURITY</p>
          <h1>Set a new password</h1>
        </div>
      </div>
      <p class="login-subtitle">Choose a strong password for your Restaurant POS account.</p>
      <form id="updatePasswordForm" class="login-form">
        <label>New password<input id="newPassword" class="text-input" type="password" autocomplete="new-password" minlength="8" required></label>
        <label>Confirm password<input id="confirmPassword" class="text-input" type="password" autocomplete="new-password" minlength="8" required></label>
        <button id="updatePasswordButton" class="primary-btn" type="submit">Update Password</button>
        <p id="updatePasswordMessage" class="login-message"></p>
      </form>
      <div class="login-links">
        <a href="login.html">Back to sign in</a>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="update-password.js"></script>
</body>
</html>
