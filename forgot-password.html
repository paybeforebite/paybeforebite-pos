<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Restaurant POS | Forgot Password</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand">
        <div class="login-logo">🔐</div>
        <div>
          <p class="eyebrow">ACCOUNT SECURITY</p>
          <h1>Reset your password</h1>
        </div>
      </div>
      <p class="login-subtitle">Enter your account email and we will send you a secure password reset link.</p>
      <form id="forgotPasswordForm" class="login-form">
        <label>Email<input id="resetEmail" class="text-input" type="email" autocomplete="email" required></label>
        <button id="resetButton" class="primary-btn" type="submit">Send Reset Link</button>
        <p id="resetMessage" class="login-message"></p>
      </form>
      <div class="login-links">
        <a href="login.html">Back to sign in</a>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
